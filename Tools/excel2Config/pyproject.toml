[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel2tres"
version = "0.1.0"
description = "Dolphin 项目 Excel → JSON 配置转换工具"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1.2",
    "click>=8.1.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]

[project.scripts]
excel2tres = "excel2tres.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
